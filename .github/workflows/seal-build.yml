name: seal-build

# Upstream camunda-spin builds and tests on Camunda's Jenkins (.ci.cambpm:
# buildMavenAndDeployToMavenCentral jdk:8, mvn:3.5) and ships no GitHub
# Actions CI, so this workflow reproduces that build: JDK 8 + Maven 3.5,
# `mvn install` over the whole reactor (core, dataformat-json-jackson,
# dataformat-xml-dom, dataformat-all), running every module's surefire suite.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

# The XML date-mapping tests (XmlDomMapJavaToXml*Test) expect the +02:00
# offset of Camunda's Jenkins agents (Europe/Berlin in April); under the
# runner's default UTC they fail on the serialized offset.
env:
  TZ: Europe/Berlin

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Set up Maven 3.5
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.5.4

      # clirr (check-api-compatibility profile) is an API-compatibility gate,
      # not a test; it is skipped here.
      - name: Build and test
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn -B -V install -Dclirr.skip=true -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false
          else
            mvn -B -V install -Dclirr.skip=true
          fi

      - name: Test summary and skipped tests
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, re, xml.etree.ElementTree as ET

          def source_reason(cls, name):
              # Upstream @Ignore carries no message; its reason is the comment
              # right above the ignored method or class.
              rel = cls.replace('.', '/') + '.java'
              files = glob.glob('*/src/test/java/' + rel)
              if not files:
                  return ''
              lines = open(files[0], encoding='utf-8').read().splitlines()
              simple = cls.rsplit('.', 1)[-1]
              pat = re.compile(r'\bclass\s+%s\b' % simple if name in (cls, simple) else r'\bvoid\s+%s\s*\(' % re.escape(name))
              idx = next((i for i, l in enumerate(lines) if pat.search(l)), None)
              if idx is None:
                  return ''
              text, i = [], idx - 1
              while i >= 0 and (lines[i].strip().startswith('@') or not lines[i].strip()):
                  i -= 1
              while i >= 0 and re.match(r'\s*(/\*\*?|\*|//)', lines[i]):
                  t = re.sub(r'^\s*(/\*\*?|\*/|\*|//)\s*', '', lines[i]).rstrip('*/ ').strip()
                  if t and not t.startswith('@author'):
                      text.insert(0, t)
                  i -= 1
              return ' '.join(text)

          tot = fail = err = skip = 0
          skipped = []
          for f in sorted(glob.glob('*/target/surefire-reports/TEST-*.xml')):
              r = ET.parse(f).getroot()
              tot += int(r.get('tests', 0)); fail += int(r.get('failures', 0))
              err += int(r.get('errors', 0)); skip += int(r.get('skipped', 0))
              for tc in r.iter('testcase'):
                  s = tc.find('skipped')
                  if s is not None:
                      cls, name = tc.get('classname'), tc.get('name')
                      msg = (s.get('message') or (s.text or '')).strip().replace('\n', ' ')
                      msg = msg or source_reason(cls, name) or 'upstream @Ignore without a stated reason'
                      skipped.append(f"{cls}.{name} -- upstream @Ignore: {msg[:200]}")
          for s in skipped:
              print('SKIPPED:', s)
          print(f'SUREFIRE TOTAL: tests={tot} passed={tot-fail-err-skip} failures={fail} errors={err} skipped={skip}')
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: camunda-spin-dataformat-xml-dom
          path: dataformat-xml-dom/target/camunda-spin-dataformat-xml-dom-1.9.0.jar
          if-no-files-found: error
